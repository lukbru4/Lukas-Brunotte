<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#566029">
<title>Mein Stylist</title>
<style>
:root{--olive:#566029;--olive-d:#3f4720;--olive-l:#eef0e0;--brown:#8b5a32;--brown-l:#f3e9de;--ink:#2a2a20;--muted:#6f6c5c;--line:#e3dfd0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#fff;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;padding-bottom:84px}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0}
header{padding:26px 0 14px;border-bottom:3px solid var(--olive);margin-bottom:18px}
h1{font-size:clamp(26px,6vw,36px);color:var(--olive-d)}h1 span{color:var(--brown)}
header p{margin:4px 0 0;color:var(--muted);font-size:14px}
button{font:inherit;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav div{max-width:960px;margin:0 auto;display:flex}
nav button{flex:1;border:0;background:none;padding:10px 4px 12px;color:var(--muted);border-top:3px solid transparent;font-size:12px}
nav button b{display:block;font-size:21px;font-weight:400}
nav button.on{color:var(--olive-d);border-top-color:var(--brown)}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;background:#fff}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--brown);font-weight:700;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--olive);background:#fff;color:var(--olive-d);border-radius:999px;padding:8px 14px;font-size:14px}
.chip.on{background:var(--olive);color:#fff}.chip.sm{padding:5px 11px;font-size:13px}
.btn{border:1px solid var(--brown);background:var(--brown);color:#fff;border-radius:12px;padding:11px 16px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:#fff;color:var(--brown)}.btn.olive{background:var(--olive);border-color:var(--olive)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}.btn.block{width:100%}
.btn.danger{background:#fff;color:#b04a35;border-color:#b04a35}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.temp{display:flex;justify-content:space-between;align-items:baseline}.temp b{font-family:Georgia,serif;font-size:28px;color:var(--olive-d)}
input[type=range]{width:100%;accent-color:var(--olive);margin:6px 0 12px}
.sw{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-size:14px}.sw input{accent-color:var(--olive);width:18px;height:18px}
.counter{background:var(--olive-l);border-left:4px solid var(--olive);border-radius:0 12px 12px 0;padding:10px 14px;margin:14px 0;font-size:14px}
.counter b{color:var(--olive-d);font-size:17px}
.look{border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:18px}
.look-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--olive);color:#fff}
.look-h h3{font-size:18px}.look-h small{opacity:.85}
.pieces{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:14px}
.piece{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.art{position:relative;background:linear-gradient(#faf8f1,#f1ede0);padding:8px}
.art svg,.art img{width:100%;height:120px;display:block;object-fit:cover;border-radius:8px}
.num{position:absolute;left:8px;top:8px;width:24px;height:24px;border-radius:50%;background:var(--brown);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.pb{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.cat{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--brown);font-weight:700}
.nm{font-family:Georgia,serif;font-size:15px;line-height:1.2}
.col{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}.col i{width:13px;height:13px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.tag{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;align-self:flex-start}
.tag.have{background:var(--olive-l);color:var(--olive-d)}.tag.need{background:var(--brown-l);color:var(--brown)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.why{margin:0;padding:0 18px 14px 36px;font-size:14px}.why li{margin-bottom:6px}.why li::marker{color:var(--brown)}
.tip{margin:0 14px 14px;padding:10px 12px;border-left:3px solid var(--brown);background:var(--brown-l);border-radius:0 10px 10px 0;font-size:14px}
.need-box{margin:0 14px 14px;background:var(--brown-l);border:1px solid #e6d3bf;border-radius:12px;padding:12px 14px;font-size:14px}
.need-box h4{margin:0 0 6px;font-family:Georgia,serif;color:var(--brown)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.modal{position:fixed;inset:0;background:rgba(30,35,15,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:18px 16px 24px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:22px}}
.field{margin-bottom:14px}
input[type=text],select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:#fff;color:var(--ink)}
.photo{display:flex;gap:12px;align-items:center}.photo .art{width:100px;flex:none}
.colors{display:flex;flex-wrap:wrap;gap:8px}.colors label{cursor:pointer}.colors input{position:absolute;opacity:0}
.colors .c{display:block;width:32px;height:32px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.colors input:checked+.c{outline:3px solid var(--brown);outline-offset:2px}
.seg{display:flex;border:1px solid var(--olive);border-radius:10px;overflow:hidden}.seg button{flex:1;border:0;background:#fff;padding:9px;color:var(--olive-d)}.seg button.on{background:var(--olive);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--olive-d);color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90%;text-align:center}
footer{text-align:center;font-size:12px;color:var(--muted);margin:24px 0}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Mein <span>Stylist</span></h1><p>Wähle deinen Stil – du bekommst komplette Outfits und siehst genau, welche Teile du dafür brauchst.</p></header>
<main id="app"></main>
<footer>Alle Kleidungsstücke sind eigene Illustrationen. Fotos kommen nur von dir.</footer>
</div>
<nav><div id="nav"></div></nav>
<div id="overlay"></div>

<script>
/* ================= Farben ================= */
const COLORS=[['schwarz','Schwarz','#1a1a1a'],['weiss','Weiß','#f2efe6'],['grau','Grau','#8a8a8a'],['beige','Beige','#cdb98f'],['creme','Creme','#e8dcc0'],['braun','Braun','#6b4a2f'],['cognac','Cognac','#9a5b2e'],['khaki','Khaki','#8b8456'],['oliv','Oliv','#5a6130'],['dunkelgruen','Dunkelgrün','#264236'],['dunkelblau','Dunkelblau','#1f2c4a'],['jeansblau','Jeansblau','#46648a'],['hellblau','Hellblau','#8fb0d0'],['bordeaux','Bordeaux','#5a1f2b'],['rot','Rot','#a8322d'],['senf','Senf','#c49a2a']].map(([id,name,hex])=>({id,name,hex}));
const COL=Object.fromEntries(COLORS.map(c=>[c.id,c]));
const CATS={shirt:{label:'Oberteil',plural:'Oberteile',icon:'👕'},pull:{label:'Pullover',plural:'Pullover',icon:'🧶'},pants:{label:'Hose',plural:'Hosen',icon:'👖'},jacket:{label:'Jacke',plural:'Jacken',icon:'🧥'},shoes:{label:'Schuhe',plural:'Schuhe',icon:'👟'},acc:{label:'Accessoire',plural:'Accessoires',icon:'🧣'}};

/* ================= Stile ================= */
const STYLES={
 country:{name:'Country',icon:'🌾',desc:'Rustikal und gemütlich: Karo, Cord, Leder und Erdtöne.',palette:['braun','cognac','oliv','khaki','beige','creme','dunkelgruen','senf','bordeaux','jeansblau'],tips:['Karohemd offen über einem schlichten Shirt tragen.','Ärmel einmal umkrempeln, Hose leicht über dem Stiefel enden lassen.','Brauner Ledergürtel passend zu den Schuhen.','Lieber Ton in Ton aus Erdfarben als viele Farben.']},
 grunge:{name:'Grunge',icon:'🎸',desc:'Lässig-rebellisch: Flanell, Band-Shirts, Boots und Layering.',palette:['schwarz','grau','dunkelgruen','bordeaux','oliv','braun','jeansblau','khaki'],tips:['Flanellhemd offen über einem Band-Shirt – das Grunge-Basic.','Absichtlich nicht zu perfekt kombinieren.','Zerrissene Jeans mit klobigen Boots erden den Look.','Dunkle, gedeckte Farben, gern leicht verwaschen.']},
 oldmoney:{name:'Old Money',icon:'🥂',desc:'Zeitlos und hochwertig: gedeckte Farben, feine Stoffe, keine Logos.',palette:['dunkelblau','creme','beige','weiss','braun','cognac','dunkelgruen','grau','bordeaux'],tips:['Hemd in die Hose stecken, schlichter Ledergürtel.','Wenige hochwertige Teile in ruhigen Farben.','Loafer mit dünnen Söckchen oder ohne Socken.','Pullover locker über die Schultern legen.']},
 streetwear:{name:'Streetwear',icon:'🛹',desc:'Urban und bequem: Hoodies, Cargos, Sneaker, Oversize.',palette:['schwarz','weiss','grau','oliv','khaki','rot','hellblau'],tips:['Mit Silhouetten spielen: oben weit, unten schmal.','Saubere, frische Sneaker.','Eine Statement-Farbe, der Rest schlicht.']},
 minimal:{name:'Casual Minimal',icon:'◻️',desc:'Schlicht und klar: wenige Farben, gute Basics.',palette:['schwarz','weiss','grau','beige','creme','dunkelblau'],tips:['Maximal 2–3 Farben pro Outfit.','Ton in Ton wirkt edel und ruhig.','Ein Statement-Teil reicht.']}
};

/* ================= Zeichnungen ================= */
let pid=0;
const ST='stroke="rgba(0,0,0,.28)" stroke-width="1.5" stroke-linejoin="round"';
function plaidDef(a,b,c){const id='p'+(++pid);return{id,def:`<pattern id="${id}" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="${a}"/><rect y="6" width="18" height="5" fill="${b}" opacity=".75"/><rect x="6" width="5" height="18" fill="${b}" opacity=".75"/><rect y="8" width="18" height="1.5" fill="${c}"/><rect x="8" width="1.5" height="18" fill="${c}"/></pattern>`}}
const BODY="M40 14L28 20L8 42L22 54L32 46V104H88V46L98 54L112 42L92 20L80 14Q60 28 40 14Z";
const SLEEVEL="M8 42L22 54L26 49L13 38Z",SLEEVER="M112 42L98 54L94 49L107 38Z";
const ART={
 tee:o=>`<path d="${BODY}" fill="${o.c}" ${ST}/><path d="M40 14Q60 30 80 14" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="2"/>${o.print?`<text x="60" y="72" text-anchor="middle" font-family="Impact,Arial Black,sans-serif" font-size="15" fill="${o.print}">${o.text||''}</text><path d="M44 80h32M48 86h24" stroke="${o.print}" stroke-width="2" opacity=".6"/>`:''}`,
 shirt:o=>{const f=o.plaid?plaidDef(...o.plaid):null;return`${f?`<defs>${f.def}</defs>`:''}<path d="${BODY}" fill="${f?`url(#${f.id})`:o.c}" ${ST}/><path d="M40 14L60 38L52 18Z M80 14L60 38L68 18Z" fill="${o.collar||o.c}" ${ST}/><path d="M60 38V104" stroke="rgba(0,0,0,.3)" stroke-width="2"/>${[52,66,80,94].map(y=>`<circle cx="60" cy="${y}" r="2" fill="rgba(0,0,0,.35)"/>`).join('')}`},
 polo:o=>`<path d="${BODY}" fill="${o.c}" ${ST}/><path d="M40 14L60 30L52 18Z M80 14L60 30L68 18Z" fill="${o.c}" stroke="rgba(0,0,0,.35)" stroke-width="1.5"/><path d="M60 30V56" stroke="rgba(0,0,0,.3)" stroke-width="2"/><circle cx="60" cy="38" r="1.8" fill="rgba(0,0,0,.4)"/><circle cx="60" cy="48" r="1.8" fill="rgba(0,0,0,.4)"/><path d="${SLEEVEL}" fill="rgba(0,0,0,.15)"/><path d="${SLEEVER}" fill="rgba(0,0,0,.15)"/>`,
 sweater:o=>`<path d="${BODY}" fill="${o.c}" ${ST}/><rect x="32" y="94" width="56" height="10" fill="rgba(0,0,0,.18)"/>${[36,42,48,54,60,66,72,78,84].map(x=>`<path d="M${x} 94V104" stroke="rgba(0,0,0,.25)"/>`).join('')}<path d="${SLEEVEL}" fill="rgba(0,0,0,.18)"/><path d="${SLEEVER}" fill="rgba(0,0,0,.18)"/>${o.v?`<path d="M42 14L60 42L78 14Z" fill="#f4f1e8" stroke="rgba(0,0,0,.28)" stroke-width="1.5"/>`:o.roll?`<rect x="42" y="4" width="36" height="16" rx="6" fill="${o.c}" ${ST}/>${[48,54,60,66,72].map(x=>`<path d="M${x} 6V18" stroke="rgba(0,0,0,.2)"/>`).join('')}`:`<path d="M42 14Q60 24 78 14" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="3"/>`}${o.cable?[44,60,76].map(x=>`<path d="M${x} 52Q${x+5} 60 ${x} 68T${x} 84" fill="none" stroke="rgba(0,0,0,.22)" stroke-width="2.5"/>`).join(''):''}`,
 hoodie:o=>`<path d="${BODY}" fill="${o.c}" ${ST}/><path d="M38 16Q60 -2 82 16Q60 36 38 16Z" fill="${o.c}" ${ST}/><path d="M44 17Q60 6 76 17Q60 30 44 17Z" fill="rgba(0,0,0,.35)"/><path d="M52 30V50M68 30V50" stroke="#e8e2cf" stroke-width="2"/><path d="M38 76H82L86 96H34Z" fill="rgba(0,0,0,.14)" stroke="rgba(0,0,0,.28)"/><rect x="32" y="98" width="56" height="6" fill="rgba(0,0,0,.2)"/>`,
 cardi:o=>`<path d="${BODY}" fill="${o.c}" ${ST}/><path d="M42 14L60 46L78 14Z" fill="#f4f1e8" opacity=".95" stroke="rgba(0,0,0,.28)"/><path d="M60 46V104" stroke="rgba(0,0,0,.3)" stroke-width="2"/>${[56,68,80,92].map(y=>`<circle cx="60" cy="${y}" r="2.3" fill="rgba(0,0,0,.45)"/>`).join('')}<rect x="32" y="96" width="56" height="8" fill="rgba(0,0,0,.18)"/>`,
 pants:o=>`<path d="M34 8H86L94 110H64L60 46L56 110H26Z" fill="${o.c}" ${ST}/><path d="M34 16H86" stroke="rgba(0,0,0,.3)" stroke-width="5"/>${[40,52,68,80].map(x=>`<rect x="${x-1}" y="8" width="2.5" height="9" fill="rgba(0,0,0,.35)"/>`).join('')}<path d="M60 8V46" stroke="rgba(0,0,0,.3)"/><path d="M38 22Q44 34 52 24M82 22Q76 34 68 24" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="1.5"/>${o.cord?[0,1,2,3,4,5,6].map(i=>`<path d="M${36+i*2} 40L${32+i*2} 108M${84-i*2} 40L${88-i*2} 108" stroke="rgba(0,0,0,.14)"/>`).join(''):''}${o.rip?`<path d="M36 62L52 66M36 70L50 72M70 82L84 78M72 90L86 88" stroke="#f2efe6" stroke-width="2.5" stroke-linecap="round"/>`:''}${o.cargo?`<rect x="28" y="62" width="16" height="18" rx="2" fill="rgba(0,0,0,.14)" stroke="rgba(0,0,0,.3)"/><rect x="76" y="62" width="16" height="18" rx="2" fill="rgba(0,0,0,.14)" stroke="rgba(0,0,0,.3)"/>`:''}${o.crease?`<path d="M45 24L40 108M75 24L80 108" stroke="rgba(255,255,255,.35)"/>`:''}`,
 jacket:o=>{const k=o.k||'wax';return`<path d="M38 12L22 20L6 62L18 68L26 52V${k==='trench'||k==='wool'?118:108}H94V52L102 68L114 62L98 20L82 12L60 26Z" fill="${o.c}" ${ST}/>`+
  (k==='blazer'?`<path d="M38 12L60 60L50 40L44 20Z M82 12L60 60L70 40L76 20Z" fill="rgba(0,0,0,.22)" stroke="rgba(0,0,0,.3)"/><circle cx="58" cy="76" r="2.4" fill="rgba(0,0,0,.45)"/><circle cx="58" cy="90" r="2.4" fill="rgba(0,0,0,.45)"/><path d="M30 86h14M76 86h14" stroke="rgba(0,0,0,.3)" stroke-width="2"/>`:
  k==='parka'?`<path d="M36 14Q60 -6 84 14Q60 36 36 14Z" fill="${o.c}" ${ST}/><path d="M44 15Q60 4 76 15Q60 28 44 15Z" fill="rgba(0,0,0,.4)"/><path d="M60 26V108" stroke="rgba(0,0,0,.35)" stroke-width="2"/><rect x="30" y="74" width="22" height="16" rx="2" fill="rgba(0,0,0,.14)" stroke="rgba(0,0,0,.3)"/><rect x="68" y="74" width="22" height="16" rx="2" fill="rgba(0,0,0,.14)" stroke="rgba(0,0,0,.3)"/>`:
  k==='bomber'?`<rect x="26" y="98" width="68" height="10" fill="rgba(0,0,0,.25)"/><path d="M42 12Q60 26 78 12L74 6Q60 14 46 6Z" fill="rgba(0,0,0,.3)"/><path d="M60 26V108" stroke="rgba(255,255,255,.35)" stroke-width="2"/><path d="M6 62L18 68" stroke="rgba(0,0,0,.3)" stroke-width="5"/><path d="M114 62L102 68" stroke="rgba(0,0,0,.3)" stroke-width="5"/>`:
  k==='puffer'?[40,56,72,88].map(y=>`<path d="M26 ${y}H94" stroke="rgba(0,0,0,.28)" stroke-width="2"/>`).join('')+`<path d="M60 26V108" stroke="rgba(255,255,255,.4)" stroke-width="2"/><path d="M42 12Q60 24 78 12L74 6Q60 12 46 6Z" fill="rgba(0,0,0,.25)"/>`:
  k==='trench'?`<path d="M38 12L60 56L50 34Z M82 12L60 56L70 34Z" fill="rgba(0,0,0,.18)" stroke="rgba(0,0,0,.3)"/><path d="M26 74H94" stroke="rgba(0,0,0,.4)" stroke-width="5"/><rect x="56" y="70" width="8" height="8" fill="none" stroke="#d9b25c" stroke-width="2"/><path d="M60 56V118" stroke="rgba(0,0,0,.3)"/>`:
  k==='wool'?`<path d="M38 12L60 64L50 36Z M82 12L60 64L70 36Z" fill="rgba(0,0,0,.2)" stroke="rgba(0,0,0,.3)"/>${[72,88,104].map(y=>`<circle cx="58" cy="${y}" r="2.4" fill="rgba(0,0,0,.45)"/>`).join('')}`:
  k==='leather'?`<path d="M38 12L60 50L48 30Z M82 12L60 50L72 30Z" fill="rgba(255,255,255,.12)" stroke="rgba(0,0,0,.4)"/><path d="M60 50V108" stroke="rgba(255,255,255,.5)" stroke-width="2"/><path d="M28 74L52 80M92 74L68 80" stroke="rgba(255,255,255,.4)" stroke-width="2"/>`:
  k==='denim'?`<path d="M38 12L60 30L82 12L74 8Q60 18 46 8Z" fill="rgba(0,0,0,.2)"/><path d="M60 30V108" stroke="rgba(255,255,255,.35)" stroke-width="2"/><rect x="30" y="48" width="20" height="16" rx="2" fill="none" stroke="rgba(255,255,255,.4)" stroke-dasharray="3 2"/><rect x="70" y="48" width="20" height="16" rx="2" fill="none" stroke="rgba(255,255,255,.4)" stroke-dasharray="3 2"/>`:
  `<path d="M38 12L60 26L82 12L74 8Q60 16 46 8Z" fill="${o.collar||'rgba(0,0,0,.25)'}" ${ST}/><path d="M60 26V108" stroke="rgba(0,0,0,.35)" stroke-width="2"/><rect x="30" y="72" width="22" height="16" rx="2" fill="rgba(0,0,0,.14)" stroke="rgba(0,0,0,.3)"/><rect x="68" y="72" width="22" height="16" rx="2" fill="rgba(0,0,0,.14)" stroke="rgba(0,0,0,.3)"/>`)},
 boots:o=>`<path d="M24 14H56V58L94 70Q108 74 108 90V98H20Z" fill="${o.c}" ${ST}/><rect x="16" y="96" width="94" height="10" rx="3" fill="${o.sole||'#2b2118'}"/><path d="M26 28H54M26 38H54M26 48H54" stroke="rgba(255,255,255,.35)" stroke-width="2"/>${o.stitch?`<path d="M22 94H106" stroke="${o.stitch}" stroke-width="2" stroke-dasharray="4 3"/>`:''}<path d="M24 14H56V22H24Z" fill="rgba(0,0,0,.22)"/>`,
 chelsea:o=>`<path d="M26 34H58V62L94 72Q108 76 108 90V98H20Z" fill="${o.c}" ${ST}/><rect x="16" y="96" width="94" height="10" rx="3" fill="#2b2118"/><path d="M26 44H58V58H26Z" fill="rgba(0,0,0,.28)"/><path d="M30 34V26M54 34V26" stroke="${o.c}" stroke-width="6" stroke-linecap="round"/>`,

/* ================= Farb-Logik ================= */
const NEUTRAL=new Set(['schwarz','weiss','grau','beige','creme']);
const EARTH=new Set(['braun','cognac','khaki','oliv','dunkelgruen','beige','creme','senf']);
const DENIM=new Set(['jeansblau','hellblau','dunkelblau']);
const GOOD=new Set('beige+dunkelblau creme+dunkelblau cognac+dunkelblau braun+dunkelblau dunkelblau+weiss jeansblau+weiss braun+jeansblau creme+jeansblau cognac+jeansblau beige+oliv braun+oliv creme+oliv beige+dunkelgruen cognac+dunkelgruen creme+dunkelgruen bordeaux+creme bordeaux+grau bordeaux+schwarz schwarz+weiss grau+schwarz oliv+schwarz beige+braun cognac+creme creme+khaki beige+khaki'.split(' '));
const BAD=new Set('braun+schwarz dunkelblau+schwarz bordeaux+rot oliv+rot braun+grau cognac+schwarz'.split(' '));
function pair(a,b){if(a===b)return{s:.6,t:'same'};const k=[a,b].sort().join('+');
 if(GOOD.has(k))return{s:1,t:'classic'};if(BAD.has(k))return{s:.3,t:'clash'};
 if(NEUTRAL.has(a)||NEUTRAL.has(b))return{s:.9,t:'neutral'};
 if(EARTH.has(a)&&EARTH.has(b))return{s:.8,t:'earth'};
 if((DENIM.has(a)&&EARTH.has(b))||(DENIM.has(b)&&EARTH.has(a)))return{s:.8,t:'earth'};
 if(['rot','senf','bordeaux','hellblau'].includes(a)&&['rot','senf','bordeaux','hellblau'].includes(b))return{s:.35,t:'clash'};
 return{s:.55,t:'contrast'}}
function pairText(A,B){const p=pair(A.color,B.color),a=COL[A.color].name,b=COL[B.color].name,n=`„${A.name}“ zu „${B.name}“`;
 return({same:`${n}: Ton in Ton (${a}) – ruhig und bewusst.`,classic:`${n}: ${a} und ${b} sind eine bewährte Kombination.`,neutral:`${n}: ${NEUTRAL.has(A.color)?a:b} ist neutral und lässt die andere Farbe wirken.`,earth:`${n}: ${a} und ${b} sind harmonische, natürliche Töne.`,clash:`${n}: etwas kontrastreich – den Rest schlicht halten.`,contrast:`${n}: bewusster Farbkontrast – sparsam einsetzen.`})[p.t]}

/* ================= Outfit-Logik ================= */
function targets(t,rain){const pull=t<5?3:t<12?2:t<18?1:0;let jack=t<8?3:t<14?2:t<20?1:0;if(rain&&jack===0&&t<26)jack=1;return{pull,jack}}
const tempLabel=t=>t<0?'eisig':t<8?'kalt':t<14?'kühl':t<20?'mild':t<26?'warm':'heiß';
function candidates(){
  const {pull:pT,jack:jT}=targets(S.temp,S.rain),all=pool();
  const fit=(i)=>i.custom?true:i.styles.includes(S.style);
  const by=c=>all.filter(i=>i.cat===c&&fit(i));
  const warmOk=(i,t)=>i.warm===0||Math.abs(i.warm-t)<=1;
  return {pT,jT,
   shirt:by('shirt'),
   pull:pT>0?by('pull').filter(i=>warmOk(i,pT)):[],
   pants:by('pants'),
   jacket:jT>0?by('jacket').filter(i=>warmOk(i,jT)&&(!S.rain||i.rain||i.custom)):[],
   shoes:by('shoes'),acc:by('acc')};
}
function countCombos(c){
  const n=a=>Math.max(1,a.length);
  return n(c.shirt)*n(c.pull)*n(c.pants)*n(c.jacket)*n(c.shoes)*(n(c.acc)+1);
}
function score(l,c){
  const {a,b,p,j,s,x}=l,upper=b||a;let sc=0,max=0;
  [a,b,p,j,s,x].filter(Boolean).forEach(i=>{if(!i)return;
    if(COL[i.color]&&STYLES[S.style].palette.includes(i.color))sc+=.5;max+=.5;
    if(S.prefer&&isOwned(i))sc+=.7;max+=.7});
  [[upper,p],[p,s],[j,upper],[j,p],[a&&b?a:null,b],[x,upper]].filter(([u,v])=>u&&v).forEach(([u,v])=>{sc+=pair(u.color,v.color).s;max+=1});
  if(b)sc-=Math.abs(b.warm-c.pT)*.5;
  if(j){sc-=Math.abs(j.warm-c.jT)*.5;if(S.rain)sc+=j.rain?.8:-.3}
  return{sc,pct:Math.max(40,Math.min(99,Math.round(40+60*sc/max)))};
}
function build(seed,keep){
  const c=candidates(),r=rngOf(seed),pick=a=>a.length?a[Math.floor(r()*a.length)]:null;
  let best=null;
  for(let n=0;n<160;n++){
    const l={a:pick(c.shirt),b:c.pull.length?pick(c.pull):null,p:pick(c.pants),j:c.jacket.length?pick(c.jacket):null,s:pick(c.shoes),x:r()<.75?pick(c.acc):null};
    if(keep) for(const k in keep) if(keep[k]) l[k]=keep[k];
    if(!l.a&&!l.b)continue;
    const sc=score(l,c);
    if(!best||sc.sc>best.sc)best={...l,sc:sc.sc,pct:sc.pct};
  }
  if(!best)return null;
  best.c=c;best.seed=seed;best.why=explain(best,c);return best;
}
function explain(l,c){
  const st=STYLES[S.style],out=[],upper=l.b||l.a,t=S.temp;
  out.push(`<b>${st.icon} ${st.name}:</b> ${[l.a,l.b,l.p,l.j,l.s].filter(Boolean).map(i=>`„${esc(i.name)}“`).slice(0,3).join(', ')} tragen den Stil – ${esc(st.desc.toLowerCase())}`);
  if(upper&&l.p)out.push(esc(pairText(upper,l.p)));
  if(l.a&&l.b)out.push(esc(pairText(l.a,l.b)).replace(' zu ',' unter ')+' (Kragen oder Saum darf hervorschauen).');
  if(l.p&&l.s)out.push(esc(pairText(l.p,l.s)));
  if(l.j&&upper)out.push(esc(pairText(l.j,upper)));
  if(l.x)out.push(`Als Extra: „${esc(l.x.name)}“ setzt einen passenden Akzent.`);
  let w=`<b>Wetter ${t}°C (${tempLabel(t)}):</b> `;
  if(!c.pT&&!c.jT)w+='Leichte Kleidung reicht – kein Pullover oder Jacke nötig.';
  else{const p=[];if(l.b)p.push(`„${esc(l.b.name)}“ ${l.b.warm>=3?'hält richtig warm':l.b.warm===2?'wärmt angenehm':'ist eine leichte Schicht'}`);
    if(l.j)p.push(`„${esc(l.j.name)}“ ${l.j.warm>=3?'schützt auch bei Kälte':l.j.warm===2?'ist die passende Mittelschicht':'reicht als leichte Jacke'}`);w+=p.join(' und ')+'.'}
  if(S.rain)w+=l.j&&l.j.rain?' Die Jacke ist regentauglich.':' Bei Regen am besten einen Schirm mitnehmen.';
  out.push(w);return out;
}
function swap(slot){
  const l=S.look;if(!l)return;const c=l.c,key={a:'shirt',b:'pull',p:'pants',j:'jacket',s:'shoes',x:'acc'}[slot];
  const opts=c[key].filter(i=>i!==l[slot]);if(!opts.length){toast('Keine weitere Alternative für dieses Teil.');return}
  const cands=opts.map(i=>{const t={...l,[slot]:i};return{i,sc:score(t,c).sc+Math.random()*.6}}).sort((x,y)=>y.sc-x.sc);
  const pickd=cands[Math.floor(Math.random()*Math.min(4,cands.length))].i;
  const nl={...l,[slot]:pickd};const sc=score(nl,c);nl.sc=sc.sc;nl.pct=sc.pct;nl.why=explain(nl,c);S.look=nl;render();
}

  const mine=all.filter(isOwned),rest=all.filter(i=>!isOwned(i));
  let h=`<div class="chips" style="margin-bottom:14px"><button class="chip sm ${f==='all'?'on':''}" data-filter="all">Alle</button>${Object.entries(CATS).map(([id,c])=>`<button class="chip sm ${f===id?'on':''}" data-filter="${id}">${c.icon} ${c.plural}</button>`).join('')}</div>
  <div class="row" style="margin-bottom:16px"><button class="btn" data-add>📷 Eigenes Teil mit Foto hinzufügen</button></div>
  <h2 style="font-size:19px;margin:6px 0 10px;color:var(--olive-d)">Das habe ich (${mine.length})</h2>`;
  h+=mine.length?`<div class="grid">${mine.map(card).join('')}</div>`:`<div class="empty">Noch nichts markiert. Tippe unten bei einem Teil auf „Hab ich“ oder füge ein Foto hinzu.</div>`;
  h+=`<h2 style="font-size:19px;margin:24px 0 10px;color:var(--olive-d)">Alle Teile im Katalog (${rest.length})</h2><div class="grid">${rest.map(card).join('')}</div>`;
  return h;
}
function card(i){
  return `<div class="piece">${thumb(i)}<div class="pb"><div class="nm">${esc(i.name)}</div><div class="col"><i style="background:${COL[i.color].hex}"></i>${CATS[i.cat].label}</div>
   <div class="acts">${i.custom?`<button class="btn sm ghost" data-edit="${i.id}">Bearbeiten</button>`:`<button class="btn sm ${S.owned[i.id]?'ghost':'olive'}" data-own="${i.id}">${S.owned[i.id]?'✓ Hab ich':'Hab ich'}</button><button class="btn sm ghost" data-photo="${i.id}">📷</button>`}</div></div></div>`;
}
function renderNav(){$('#nav').innerHTML=[['looks','✨','Outfits'],['closet','🧥','Schrank']].map(([id,ic,l])=>`<button class="${S.view===id?'on':''}" data-nav="${id}"><b>${ic}</b>${l}</button>`).join('')}
function render(){renderNav();$('#app').innerHTML=S.view==='looks'?viewLooks():viewCloset()}
function newLook(dir){
  S.seed=Math.max(1,S.seed+dir*(1+Math.floor(Math.random()*97)));S.look=build(S.seed);save();render();
  if(!S.look)toast('Mit dieser Einstellung gibt es keine Kombination.');
}

/* ================= Fotos / eigenes Teil ================= */
function readPhoto(file,cb){
  if(!file)return;const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,520/Math.max(img.width,img.height)),w=Math.round(img.width*k),h=Math.round(img.height*k);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
    let col=null;try{const s=document.createElement('canvas');s.width=s.height=24;const x=s.getContext('2d');x.drawImage(img,img.width*.3,img.height*.3,img.width*.4,img.height*.4,0,0,24,24);const d=x.getImageData(0,0,24,24).data;let r=0,g=0,b=0,n=0;for(let p=0;p<d.length;p+=4){r+=d[p];g+=d[p+1];b+=d[p+2];n++}col=nearest(r/n,g/n,b/n)}catch(e){}
    URL.revokeObjectURL(url);cb(cv.toDataURL('image/jpeg',.72),col)};
  img.onerror=()=>{URL.revokeObjectURL(url);toast('Das Bild konnte nicht gelesen werden.')};img.src=url;
}
function nearest(r,g,b){let best=null,bd=1e9;for(const c of COLORS){const h=parseInt(c.hex.slice(1),16),R=h>>16,G=(h>>8)&255,B=h&255,d=(R-r)**2*.3+(G-g)**2*.59+(B-b)**2*.11;if(d<bd){bd=d;best=c.id}}return best}
let form=null;
function openForm(item){
  form=item?{...item}:{id:null,name:'',cat:'pull',color:'schwarz',warm:2,photo:null};drawForm();
}
function drawForm(){
  const f=form;
  $('#overlay').innerHTML=`<div class="modal" id="modal"><div class="sheet"><h2 style="margin-bottom:12px">${f.id?'Teil bearbeiten':'Eigenes Teil hinzufügen'}</h2>
  <div class="field photo"><div class="art">${f.photo?`<img src="${f.photo}" alt="">`:`<svg viewBox="0 0 120 120"><text x="60" y="76" text-anchor="middle" font-size="48">${CATS[f.cat].icon}</text></svg>`}</div>
   <div style="flex:1;display:flex;flex-direction:column;gap:8px"><button class="btn ghost" id="cam">📷 Foto aufnehmen</button><button class="btn ghost" id="gal">🖼 Aus Galerie</button></div></div>
  <input type="file" id="fcam" accept="image/*" capture="environment" hidden><input type="file" id="fgal" accept="image/*" hidden>
  <div class="field"><p class="label">Name</p><input type="text" id="fname" value="${esc(f.name)}" placeholder="z. B. Mein grüner Pullover" maxlength="60"></div>
  <div class="field"><p class="label">Art</p><select id="fcat">${Object.entries(CATS).map(([id,c])=>`<option value="${id}" ${f.cat===id?'selected':''}>${c.icon} ${c.label}</option>`).join('')}</select></div>
  <div class="field"><p class="label">Farbe</p><div class="colors">${COLORS.map(c=>`<label title="${c.name}"><input type="radio" name="fcol" value="${c.id}" ${f.color===c.id?'checked':''}><span class="c" style="background:${c.hex}"></span></label>`).join('')}</div><p id="cn" style="margin:6px 0 0;font-size:13px;color:var(--muted)">${COL[f.color].name}</p></div>
  ${(f.cat==='pull'||f.cat==='jacket')?`<div class="field"><p class="label">Wie warm?</p><div class="seg">${[[1,'Leicht'],[2,'Mittel'],[3,'Sehr warm']].map(([v,l])=>`<button type="button" data-w="${v}" class="${f.warm===v?'on':''}">${l}</button>`).join('')}</div></div>`:''}
  <div class="row" style="margin-top:16px"><button class="btn olive" id="fsave" style="flex:1">Speichern</button><button class="btn ghost" id="fcancel">Abbrechen</button>${f.id?'<button class="btn danger" id="fdel">Löschen</button>':''}</div></div></div>`;
  const m=$('#modal');m.onclick=e=>{if(e.target===m)closeForm()};
  $('#cam').onclick=()=>$('#fcam').click();$('#gal').onclick=()=>$('#fgal').click();
  $('#fcam').onchange=$('#fgal').onchange=e=>readPhoto(e.target.files[0],(d,c)=>{form.photo=d;if(c){form.color=c;toast(`Farbe erkannt: ${COL[c].name} – bei Bedarf ändern`)}form.name=$('#fname').value;drawForm()});
  $('#fname').oninput=e=>form.name=e.target.value;
  $('#fcat').onchange=e=>{form.cat=e.target.value;form.name=$('#fname').value;if(form.cat!=='pull'&&form.cat!=='jacket')form.warm=0;else if(!form.warm)form.warm=2;drawForm()};
  m.querySelectorAll('input[name=fcol]').forEach(r=>r.onchange=()=>{form.color=r.value;$('#cn').textContent=COL[r.value].name});
  m.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{form.warm=+b.dataset.w;m.querySelectorAll('[data-w]').forEach(x=>x.classList.toggle('on',x===b))});
  $('#fcancel').onclick=closeForm;$('#fsave').onclick=saveForm;
  const d=$('#fdel');if(d)d.onclick=()=>{if(confirm('Dieses Teil löschen?')){S.custom=S.custom.filter(i=>i.id!==form.id);save();closeForm();render()}};
}
function closeForm(){$('#overlay').innerHTML='';form=null}
function saveForm(){
  form.name=$('#fname').value.trim()||`${COL[form.color].name} ${CATS[form.cat].label}`;
  const it={id:form.id||uid(),name:form.name,cat:form.cat,color:form.color,warm:(form.cat==='pull'||form.cat==='jacket')?(form.warm||2):0,rain:false,photo:form.photo,styles:[]};
  const prev=S.custom.slice();const i=S.custom.findIndex(x=>x.id===it.id);if(i>=0)S.custom[i]=it;else S.custom.unshift(it);
  if(!save()){S.custom=prev;return}
  closeForm();S.look=null;render();toast('Gespeichert ✓');
}
let photoFor=null;
const fileInput=document.createElement('input');fileInput.type='file';fileInput.accept='image/*';fileInput.hidden=true;document.body.appendChild(fileInput);
fileInput.onchange=()=>{const id=photoFor;readPhoto(fileInput.files[0],d=>{S.photos[id]=d;S.owned[id]=true;if(!save()){delete S.photos[id]}render();toast('Foto gespeichert – Teil als „Hab ich“ markiert')});fileInput.value=''};

/* ================= Wetter ================= */
function loadWeather(){
  if(!navigator.geolocation){toast('Standort wird nicht unterstützt.');return}
  toast('Wetter wird geladen …');
  navigator.geolocation.getCurrentPosition(async p=>{try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.coords.latitude}&longitude=${p.coords.longitude}&current=temperature_2m,precipitation,weather_code`);
    const c=(await r.json()).current,code=c.weather_code;
    S.temp=Math.round(c.temperature_2m);S.rain=c.precipitation>0||(code>=51&&code<=67)||(code>=80&&code<=82)||code>=95;
    save();newLook(0);toast(`Aktuell ${S.temp}°C${S.rain?' mit Regen':''}`)}catch(e){toast('Wetter nicht verfügbar – bitte manuell einstellen.')}},
   ()=>toast('Standort nicht freigegeben – bitte Temperatur manuell einstellen.'),{timeout:10000});
}

/* ================= Events ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.nav){S.view=d.nav;render();window.scrollTo(0,0)}
  else if(d.style){S.style=d.style;save();newLook(0)}
  else if(d.filter){S.filter=d.filter;render()}
  else if('add' in d)openForm(null);
  else if(d.edit)openForm(S.custom.find(i=>i.id===d.edit));
  else if(d.own){if(S.owned[d.own]){delete S.owned[d.own]}else S.owned[d.own]=true;save();
     if(S.view==='looks'&&S.look)S.look.why=S.look.why;render()}
  else if(d.photo){photoFor=d.photo;fileInput.click()}
  else if(d.swap)swap(d.swap);
  else if(t.id==='next')newLook(1);
  else if(t.id==='prev')newLook(-1);
  else if(t.id==='geo')loadWeather();
});
document.addEventListener('input',e=>{if(e.target.id==='temp'){S.temp=+e.target.value;$('#tv').textContent=S.temp+'°C';$('#tl').textContent=tempLabel(S.temp)}});
document.addEventListener('change',e=>{
  if(e.target.id==='temp'){save();newLook(0)}
  if(e.target.id==='rain'){S.rain=e.target.checked;save();newLook(0)}
  if(e.target.id==='prefer'){S.prefer=e.target.checked;save();newLook(0)}
});
S.look=build(S.seed);render();
</script>
</body>
